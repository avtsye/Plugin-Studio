name: Validate and package Otzaria plugin

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "screenshots/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Validate & package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Vendor CodeMirror locally
        shell: bash
        run: |
          set -e
          mkdir -p vendor/codemirror
          BASE="https://cdn.jsdelivr.net/npm/codemirror@5.65.20"
          curl -fsSL "$BASE/lib/codemirror.js" -o vendor/codemirror/codemirror.js
          curl -fsSL "$BASE/lib/codemirror.css" -o vendor/codemirror/codemirror.css
          curl -fsSL "$BASE/mode/javascript/javascript.js" -o vendor/codemirror/javascript.js
          curl -fsSL "$BASE/mode/xml/xml.js" -o vendor/codemirror/xml.js
          curl -fsSL "$BASE/mode/css/css.js" -o vendor/codemirror/css.js
          curl -fsSL "$BASE/mode/htmlmixed/htmlmixed.js" -o vendor/codemirror/htmlmixed.js
          curl -fsSL "$BASE/addon/edit/matchbrackets.js" -o vendor/codemirror/matchbrackets.js
          curl -fsSL "$BASE/addon/edit/closebrackets.js" -o vendor/codemirror/closebrackets.js
          curl -fsSL "$BASE/addon/fold/foldcode.js" -o vendor/codemirror/foldcode.js
          curl -fsSL "$BASE/addon/fold/foldgutter.js" -o vendor/codemirror/foldgutter.js
          curl -fsSL "$BASE/addon/fold/foldgutter.css" -o vendor/codemirror/foldgutter.css
          curl -fsSL "$BASE/addon/fold/brace-fold.js" -o vendor/codemirror/brace-fold.js
          curl -fsSL "$BASE/addon/hint/show-hint.js" -o vendor/codemirror/show-hint.js
          curl -fsSL "$BASE/addon/hint/show-hint.css" -o vendor/codemirror/show-hint.css
          test -s vendor/codemirror/codemirror.js
          test -s vendor/codemirror/codemirror.css

      - name: Sanitize vendored CodeMirror design tokens
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              "vendor/codemirror/codemirror.css": [
                  ("font-family: monospace", "font-family: var(--font-main)"),
                  ("color: black", "color: var(--color-on-surface)"),
                  ("background: white", "background: var(--color-surface)"),
                  ("background: #f7f7f7", "background: var(--color-surface-container-low)"),
                  ("border-right: 1px solid #ddd", "border-right: 1px solid var(--color-outline-variant)"),
                  ("color: #999", "color: var(--color-on-surface-variant)")
              ],
              "vendor/codemirror/foldgutter.css": [
                  ("color: #b9f", "color: var(--color-primary)"),
                  ("color: blue", "color: var(--color-primary)"),
                  ("font-family: arial", "font-family: var(--font-main)")
              ],
              "vendor/codemirror/show-hint.css": [
                  ("font-family: monospace", "font-family: var(--font-main)"),
                  ("background: white", "background: var(--color-surface)"),
                  ("color: #08f", "color: var(--color-primary)"),
                  ("border-radius: 3px", "border-radius: var(--radius-sm)")
              ]
          }
          for path, pairs in replacements.items():
              p=Path(path)
              s=p.read_text(encoding="utf-8")
              for a,b in pairs: s=s.replace(a,b)
              p.write_text(s,encoding="utf-8")
          print("OK: vendored CodeMirror CSS normalized to Otzaria tokens")
          PY

      # Official Otzaria validator. Without store credentials it validates
      # and builds only; it does not publish the plugin to the store.
      - name: HTML resource integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          refs=re.findall(r'''(?:src|href)=["']([^"'?#]+)["']''', html)
          local=[x for x in refs if not x.startswith(("http://","https://","data:","#"))]
          missing=[x for x in local if not Path(x).is_file()]
          if missing:
              raise SystemExit("Missing local resources: "+", ".join(missing))
          print(f"OK: {len(local)} local HTML resources resolved")
          PY

      - name: Validate with official Otzaria validator
        uses: Otzaria/otzaria-plugin-validator@v1

      - name: Syntax · core
        shell: bash
        run: |
          node --check app.js
          node --check sdk-spec.js
          node --check sdk-signatures.js

      - name: Syntax · editor
        if: always()
        shell: bash
        run: |
          node --check editor-advanced.js
          node --check editor-codemirror.js
          node --check studio-settings.js
          test -s vendor/codemirror/codemirror.js
          test -s vendor/codemirror/codemirror.css

      - name: Syntax · tools
        if: always()
        shell: bash
        run: |
          node --check plugin-tools.js
          node --check diagnostics.js
          node --check debug-tools.js
          node --check package-center.js
          node --check symbol-library-4.js
          node --check visual-builder.js
      - name: Visual Builder preservation regression
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("visual-builder.js").read_text(encoding="utf-8")
          for marker in ['doc.querySelector(".plugin-ui")','current.replaceWith(next)','doc.body.appendChild(next)','script[data-vb-bindings]']:
              if marker not in s:
                  raise SystemExit("Missing Visual Builder preservation marker: "+marker)
          if 'A.state.files[target]=generate()' not in s:
              raise SystemExit("Visual Builder generation path missing")
          print("OK: Visual Builder preserves document shell")
          PY
          node --check release-wizard.js

      - name: Syntax · crash-recovery.js
        if: always()
        shell: bash
        run: node --check crash-recovery.js

      - name: Syntax · help.js
        if: always()
        shell: bash
        run: node --check help.js

      - name: Syntax · project-manager.js
        if: always()
        shell: bash
        run: node --check project-manager.js

      - name: Syntax · simple-ui.js
        if: always()
        shell: bash
        run: node --check simple-ui.js

      - name: Syntax · onboarding.js
        if: always()
        shell: bash
        run: node --check onboarding.js

      - name: Syntax · one-click-build.js
        if: always()
        shell: bash
        run: node --check one-click-build.js

      - name: Syntax · Studio 2.1 modules
        if: always()
        shell: bash
        run: |
          node --check plugin-generator.js
          node --check testing-studio.js
          node --check release-pro.js
          node --check studio-polish.js
          node --check editor-pro.js
          node --check studio-shell.js
          node --check i18n.js
          node --check manifest-intelligence.js
          node --check offline-scanner.js
          node --check symbol-index.js
          node --check problems-2.js
          node --check global-search-3.js
          node --check diff-editor-3.js
          node --check manifest-intellisense.js
          node --check intelligence-4.js
          node --check intelligence-4-2.js
          node --check symbol-integration-4.js
          node --check release-center-3.js
          node --check symbol-tools-3.js
          node --check compatibility-3.js
          node --check test-runner-3.js
          node --check accessibility-studio.js
          node --check theme-lab.js
          node --check project-dashboard-3.js
          node --check outline-3.js
          node --check snippet-library-3.js
          node --check template-gallery-3.js
          node --check performance-profiler-3.js
          node --check release-profiles-3.js
          node --check legacy-localization-3.js
          node --check split-editor-3.js
          node --check event-simulator-3.js
          node --check dependency-graph-3.js
          node --check recovery-center-3.js
          node --check studio-integration-3.js

      - name: Version consistency
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const m=JSON.parse(fs.readFileSync("manifest.json","utf8"));
          const h=fs.readFileSync("index.html","utf8");
          const shown=h.match(/Plugin Studio <small>([^<]+)<\/small>/)?.[1];
          if(shown!==m.version) throw new Error("Version mismatch: UI "+shown+" vs manifest "+m.version);
          for(const f of ["intelligence-4-2.js","symbol-integration-4.js","workspace-5-1.js","editor-experience-5-2.js","ide-intelligence-5-4.js","studio-5-4.js","localization-5-4.js","stability-5-5.js","friendly-workspace-5-5.js","new-plugin-wizard-5-5.js"]) if(!h.includes('src="'+f+'"')) throw new Error("Missing runtime module "+f);
          NODE

      - name: UI contract preservation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          css=Path("styles.css").read_text(encoding="utf-8")
          ids=set(re.findall(r'\bid=["\']([^"\']+)',html))
          required={"editor","projects","newProject","importPackage","preview","previewLargeBtn","buildBtn","analyze","exportProject","moreToolsBtn","moreTools","modeBtn","helpBtn","files","tabs","breadcrumbs","status","sdk","console","problems","frame","dlg","dlgTitle","dlgBody","previewDlg","previewFrameLarge","visualBuilderBtn","symbolLibrary4Btn","apiLabBtn","designer","diagnosticsBtn","doctorBtn","packageCenterBtn","releaseWizardBtn","debugBtn","toolsBtn","eventsBtn","historyBtn","templates","projectSearch","fileSearchBtn","foldBtn","quickOpen","studioSettingsBtn"}
          missing=sorted(required-ids)
          if missing: raise SystemExit("UI contract IDs missing: "+", ".join(missing))
          if "Plugin Studio 5 — visual refresh" not in css: raise SystemExit("PS5 visual layer missing")
          if css.count("Plugin Studio 5 — visual refresh") != 1: raise SystemExit("PS5 visual layer duplicated")
          print(f"OK: {len(required)} critical UI contracts preserved")
          PY

      - name: Workspace 5.1 presentation regression
        run: |
          node --check workspace-5-1.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path("workspace-5-1.js").read_text(encoding="utf-8")
          css=Path("styles.css").read_text(encoding="utf-8")
          html=Path("index.html").read_text(encoding="utf-8")
          for x in ["activityBar","commandCenter","workspaceSplitter","zenMode","workspaceStatus","workspaceContext","plugin-studio-workspace-v51"]:
              if x not in s and x not in css: raise SystemExit("Missing workspace feature: "+x)
          for x in ["--ps-left","--ps-right","--ps-bottom","@media(max-width:760px)","@media(max-width:480px)"]:
              if x not in css: raise SystemExit("Missing presentation guard: "+x)
          if 'src="workspace-5-1.js"' not in html: raise SystemExit("Workspace runtime not loaded")
          print("OK: 5.1 workspace and responsive presentation guards present")
          PY

      - name: Stacking and overflow regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css=Path("styles.css").read_text(encoding="utf-8")
          required=["--z-editor","--z-panel","--z-header","--z-float","--z-menu","--z-modal","isolation:isolate",".workspace51 .moreTools",".workspace51 .suggestions",".workspace51 dialog",".workspace51 .CodeMirror-hints"]
          missing=[x for x in required if x not in css]
          if missing: raise SystemExit("Missing stacking guards: "+", ".join(missing))
          vals={"editor":1,"panel":20,"header":60,"float":200,"menu":400,"modal":1000}
          if not vals["editor"]<vals["panel"]<vals["header"]<vals["float"]<vals["menu"]<vals["modal"]:
              raise SystemExit("Invalid stacking hierarchy")
          print("OK: deterministic stacking hierarchy and overflow guards present")
          PY

      - name: Editor Experience 5.2 regression
        run: |
          node --check editor-experience-5-2.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path("editor-experience-5-2.js").read_text(encoding="utf-8")
          css=Path("styles.css").read_text(encoding="utf-8")
          html=Path("index.html").read_text(encoding="utf-8")
          for x in ["peekDefinition","editorQuickFix","refactorPreview","inlineProblems","breadcrumbs","tabActions","Alt-F12","Ctrl-.","Ctrl-Alt-R"]:
              if x not in js and x not in css: raise SystemExit("Missing 5.2 editor feature: "+x)
          for x in [".peekDefinition",".editorOutline",".editorQuickFix","var(--z-menu)","var(--z-float)","@media(max-width:760px)"]:
              if x not in css: raise SystemExit("Missing 5.2 presentation guard: "+x)
          if 'src="editor-experience-5-2.js"' not in html: raise SystemExit("5.2 runtime not loaded")
          if not any(v in html for v in ["5.2.0","5.3.0","5.4.0","5.5.0"]): raise SystemExit("UI version older than 5.2.0")
          print("OK: Plugin Studio 5.2 editor experience present")
          PY

      - name: Bundled 5.3 and 5.4 regression
        run: |
          node --check ide-intelligence-5-4.js
          node --check studio-5-4.js
          python3 - <<'PY'
          from pathlib import Path
          ide=Path("ide-intelligence-5-4.js").read_text(encoding="utf-8")
          q=Path("studio-5-4.js").read_text(encoding="utf-8")
          css=Path("styles.css").read_text(encoding="utf-8")
          html=Path("index.html").read_text(encoding="utf-8")
          for x in ["peekRefs","quickFixMenu","importHealth","pinned","Ctrl-Shift-F12","Ctrl-Alt-I"]:
              if x not in ide: raise SystemExit("Missing bundled 5.3 feature: "+x)
          for x in ["testHub","builder","simulatorPreset","activityQuality","vb54Desktop","hubDebug","hubA11y"]:
              if x not in q: raise SystemExit("Missing 5.4 quality feature: "+x)
          for x in ['src="ide-intelligence-5-4.js"','src="studio-5-4.js"']:
              if x not in html: raise SystemExit("Missing 5.4 runtime marker: "+x)
          if not any(v in html for v in ["5.4.0","5.5.0"]):
              raise SystemExit("UI version older than bundled 5.4 baseline")
          for x in [".ide54Tools",".testHubMetrics",".vb54Bar","data-viewport"]:
              if x not in css: raise SystemExit("Missing 5.4 presentation marker: "+x)
          print("OK: bundled 5.3 intelligence and 5.4 quality workspace present")
          PY

      - name: Topbar collision regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css=Path("styles.css").read_text(encoding="utf-8")
          required=[
            "5.4.2 topbar collision fix",
            'grid-template-areas:"brand command nav"',
            'grid-template-areas:"brand command" "nav nav"',
            'grid-template-areas:"brand" "command" "nav"',
            "position:static!important",
            "overflow-x:auto"
          ]
          missing=[x for x in required if x not in css]
          if missing: raise SystemExit("Missing topbar collision guards: "+", ".join(missing))
          print("OK: command center participates in topbar layout at desktop/tablet/mobile widths")
          PY

      - name: Full Hebrew English localization regression
        run: |
          node --check localization-5-4.js
          node --check workspace-5-1.js
          node --check editor-experience-5-2.js
          node --check ide-intelligence-5-4.js
          node --check studio-5-4.js
          node --check studio-settings.js
          python3 - <<'PY'
          from pathlib import Path
          loc=Path("localization-5-4.js").read_text(encoding="utf-8")
          html=Path("index.html").read_text(encoding="utf-8")
          required=["commandSearch","refactorPreview","peekRefs","quickFixes","importHealth","quality","runTests","studioSettings","editorFont","offlineScan"]
          missing=[x for x in required if loc.count(x)<2]
          if missing: raise SystemExit("Locale key missing from one language: "+", ".join(missing))
          order=[html.find('src="localization-5-4.js"'),html.find('src="workspace-5-1.js"'),html.find('src="editor-experience-5-2.js"')]
          if min(order)<0 or order!=sorted(order): raise SystemExit("Localization runtime must load before dynamic 5.x UI")
          dynamic={
            "workspace-5-1.js":["Search files, commands and symbols",">Open<",">Rename<",">Delete<"],
            "editor-experience-5-2.js":["Refactor Preview",">Extract Variable<",">Extract Function<"],
            "ide-intelligence-5-4.js":["Peek References ·",">Quick Fixes<","All relative imports resolve."],
            "studio-5-4.js":[">Desktop<",">Tablet<",">Mobile<",">Run tests<",">Offline scan<"],
            "studio-settings.js":["Studio Settings",">Word wrap<",">ממשק קומפקטי<"]
          }
          for file,bad in dynamic.items():
              s=Path(file).read_text(encoding="utf-8")
              hits=[x for x in bad if x in s]
              if hits: raise SystemExit(file+" contains untranslated UI literals: "+", ".join(hits))
          print("OK: Hebrew/English locale coverage and dynamic UI guards present")
          PY

      - name: Legacy mixed-language UI regression
        run: |
          node --check accessibility-studio.js
          node --check compatibility-3.js
          node --check dependency-graph-3.js
          node --check event-simulator-3.js
          node --check global-search-3.js
          node --check performance-profiler-3.js
          node --check project-dashboard-3.js
          python3 - <<'PY'
          from pathlib import Path
          files=["accessibility-studio.js","compatibility-3.js","dependency-graph-3.js","event-simulator-3.js","global-search-3.js","performance-profiler-3.js","project-dashboard-3.js"]
          forbidden=[" / Accessibility"," / Compatibility"," / Dependency"," / Event"," / Search"," / Performance"," / Project"," / Tests"," / Release"," / Emit"," / Preview"]
          hits=[]
          for f in files:
              s=Path(f).read_text(encoding="utf-8")
              for x in forbidden:
                  if x in s: hits.append(f+": "+x)
          if hits: raise SystemExit("Mixed-language UI remains: "+"; ".join(hits))
          print("OK: audited legacy tools no longer use bilingual slash labels")
          PY

      - name: Remaining legacy localization regression
        run: |
          for f in help.js onboarding.js package-center.js permission-assistant.js plugin-generator.js project-manager.js recovery-center-3.js; do node --check "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          files=["help.js","onboarding.js","package-center.js","permission-assistant.js","plugin-generator.js","project-manager.js","recovery-center-3.js"]
          forbidden=[" / ","בדיקות / Tests","הפצה / Release","שחזר / Restore","חיפוש / Search","שלח / Emit"]
          hits=[]
          for f in files:
              s=Path(f).read_text(encoding="utf-8")
              for x in forbidden:
                  if x in s: hits.append(f+": "+x)
              if "StudioLocale54" not in s: hits.append(f+": missing locale runtime")
          if hits: raise SystemExit("Legacy localization audit failed: "+"; ".join(hits))
          loc=Path("localization-5-4.js").read_text(encoding="utf-8")
          for key in ["helpTitle","welcome","packageCenter","permissionAssistant","pluginGenerator","myProjects","recoveryCenter"]:
              if loc.count(key)<2: raise SystemExit("Missing bilingual locale key: "+key)
          print("OK: remaining legacy modules use one selected language")
          PY

      - name: Studio 5.5 stability regression
        run: |
          node --check stability-5-5.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path("stability-5-5.js").read_text(encoding="utf-8")
          css=Path("styles.css").read_text(encoding="utf-8")
          html=Path("index.html").read_text(encoding="utf-8")
          manifest=Path("manifest.json").read_text(encoding="utf-8")
          for x in ["modal","alertBox","confirmBox","promptBox","saveSession","restoreSession","plugin-studio-session-5-5"]:
              if x not in js: raise SystemExit("Missing 5.5 stability feature: "+x)
          for x in ["Plugin Studio 5.5","focus-visible","ps55Actions","max-height:min(88vh"]:
              if x not in css: raise SystemExit("Missing 5.5 presentation guard: "+x)
          if 'src="stability-5-5.js"' not in html or "5.5.0" not in html or '"version": "5.5.0"' not in manifest:
              raise SystemExit("5.5 runtime/version mismatch")
          print("OK: Studio 5.5 stability layer and version are consistent")
          PY

      - name: Legacy debt inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=[p for p in Path(".").glob("*.js") if p.name not in {"stability-5-5.js"}]
          import re
          native=sum(sum(1 for line in p.read_text(encoding="utf-8").splitlines() for name in ("alert(","confirm(","prompt(") if name in line and ("."+name) not in line) for p in files)
          print(f"INFO: native dialog call sites remaining: {native}")
          if native>82: raise SystemExit("Native dialog debt unexpectedly increased beyond corrected 5.5 baseline")
          print("OK: legacy dialog debt is bounded while migration continues")
          PY

      - name: Studio 5.5 editor workflows regression
        run: |
          node --check problems-2.js
          node --check split-editor-3.js
          node --check plugin-tools.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("problems-2.js").read_text(encoding="utf-8")
          s=Path("split-editor-3.js").read_text(encoding="utf-8")
          t=Path("plugin-tools.js").read_text(encoding="utf-8")
          css=Path("styles.css").read_text(encoding="utf-8")
          for x in ["counts","pFilter","data-pcol","problemCounts","updateBadge"]:
              if x not in p: raise SystemExit("Missing Problems 5.5 feature: "+x)
          for x in ["splitDirty","saveChanges","Studio55.confirm","splitRightName"]:
              if x not in s: raise SystemExit("Missing Split Editor 5.5 feature: "+x)
          if "Studio55.prompt" not in t or "Studio55?.alert" not in t:
              raise SystemExit("Plugin tools not migrated to Studio 5.5 dialogs")
          for x in [".problemToolbar",".problemRow.error","#problemsTab[data-count]",".splitEditors"]:
              if x not in css: raise SystemExit("Missing editor workflow CSS: "+x)
          print("OK: 5.5 Problems, Split Editor and dialog migration present")
          PY

      - name: Studio 5.5 tabs and Quick Fix regression
        run: |
          node --check editor-experience-5-2.js
          node --check ide-intelligence-5-4.js
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          e=Path("editor-experience-5-2.js").read_text(encoding="utf-8")
          i=Path("ide-intelligence-5-4.js").read_text(encoding="utf-8")
          a=Path("app.js").read_text(encoding="utf-8")
          for x in ["IDE54?.quickFixMenu","L(\"problem\")"]:
              if x not in e: raise SystemExit("Missing unified Quick Fix feature: "+x)
          for x in ["recentMenu","ide54Recent","aria-pressed","pinned"]:
              if x not in i: raise SystemExit("Missing 5.5 tab feature: "+x)
          migrated=["לא ניתן לשמור את הפרויקט","manifest.json אינו תקין","לא ניתן למחוק את manifest.json","אין snapshots להשוואה"]
          for x in migrated:
              if 'alert("'+x in a: raise SystemExit("Core alert not migrated: "+x)
          print("OK: Tabs, Quick Fix and first core dialog migration present")
          PY

      - name: Studio 5.5 runtime smoke contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script[^>]+src="([^"]+)"',h)
          required=["app.js","localization-5-4.js","workspace-5-1.js","editor-experience-5-2.js","ide-intelligence-5-4.js","studio-5-4.js","stability-5-5.js"]
          pos={x:scripts.index(x) if x in scripts else -1 for x in required}
          if any(v<0 for v in pos.values()): raise SystemExit("Runtime module missing: "+str(pos))
          if not(pos["app.js"]<pos["localization-5-4.js"]<pos["workspace-5-1.js"]<pos["editor-experience-5-2.js"]<pos["ide-intelligence-5-4.js"]<pos["studio-5-4.js"]<pos["stability-5-5.js"]):
              raise SystemExit("Unsafe Studio runtime load order: "+str(pos))
          app=Path("app.js").read_text(encoding="utf-8")
          if 'async function goToLine' not in app or 'Studio55.prompt("עבור לשורה' not in app:
              raise SystemExit("Go-to-line 5.5 migration missing")
          print("OK: runtime module order and 5.5 core smoke contract")
          PY

      - name: Default project real API contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          app=Path("app.js").read_text(encoding="utf-8")
          spec=Path("sdk-spec.js").read_text(encoding="utf-8")
          data=json.loads(spec.split("=",1)[1].rstrip(";\n"))
          expected=["app.getInfo","app.getTheme","library.listRecentBooks","library.findBooks","reader.getCurrentState","reader.openBook","ui.showMessage","reader.addToolbarItem","reader.removeToolbarItem","storage.get","storage.set"]
          missing=[x for x in expected if x not in data["apiMethods"]]
          if missing: raise SystemExit("Default project references non-SDK APIs: "+", ".join(missing))
          absent=[x for x in expected if x not in app]
          if absent: raise SystemExit("Default real API example missing: "+", ".join(absent))
          perms=set(data.get("baselinePermissions",[]))|{"library.books.read","reader.open","reader.toolbar"}
          for api in expected:
              p=data.get("methodPermissions",{}).get(api)
              if p and p not in perms: raise SystemExit("Default project lacks permission for "+api+": "+p)
          if "API אמיתי" not in app: raise SystemExit("Default project must identify itself as real SDK example")
          print("OK: default project APIs exist in SDK and required permissions are covered")
          PY

