            echo "- ID: \`${{ steps.meta.outputs.id }}\`"
            echo "- Version: \`${{ steps.meta.outputs.version }}\`"
            echo "- File: \`${{ steps.meta.outputs.filename }}\`"
            echo "- Official Otzaria validation: passed"
          } >> "$GITHUB_STEP_SUMMARY"
