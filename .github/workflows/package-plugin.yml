name: Validate and package Otzaria plugin

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "screenshots/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Validate & package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Official Otzaria validator. Without store credentials it validates
      # and builds only; it does not publish the plugin to the store.
      - name: Validate with official Otzaria validator
        uses: Otzaria/otzaria-plugin-validator@v1

      - name: Vendor CodeMirror locally
        shell: bash
        run: |
          set -e
          mkdir -p vendor/codemirror
          BASE="https://cdn.jsdelivr.net/npm/codemirror@5.65.20"
          curl -fsSL "$BASE/lib/codemirror.js" -o vendor/codemirror/codemirror.js
          curl -fsSL "$BASE/lib/codemirror.css" -o vendor/codemirror/codemirror.css
          curl -fsSL "$BASE/mode/javascript/javascript.js" -o vendor/codemirror/javascript.js
          curl -fsSL "$BASE/mode/xml/xml.js" -o vendor/codemirror/xml.js
          curl -fsSL "$BASE/mode/css/css.js" -o vendor/codemirror/css.js
          curl -fsSL "$BASE/mode/htmlmixed/htmlmixed.js" -o vendor/codemirror/htmlmixed.js
          curl -fsSL "$BASE/addon/edit/matchbrackets.js" -o vendor/codemirror/matchbrackets.js
          curl -fsSL "$BASE/addon/edit/closebrackets.js" -o vendor/codemirror/closebrackets.js
          curl -fsSL "$BASE/addon/fold/foldcode.js" -o vendor/codemirror/foldcode.js
          curl -fsSL "$BASE/addon/fold/foldgutter.js" -o vendor/codemirror/foldgutter.js
          curl -fsSL "$BASE/addon/fold/foldgutter.css" -o vendor/codemirror/foldgutter.css
          curl -fsSL "$BASE/addon/fold/brace-fold.js" -o vendor/codemirror/brace-fold.js
          curl -fsSL "$BASE/addon/hint/show-hint.js" -o vendor/codemirror/show-hint.js
          curl -fsSL "$BASE/addon/hint/show-hint.css" -o vendor/codemirror/show-hint.css
          test -s vendor/codemirror/codemirror.js
          test -s vendor/codemirror/codemirror.css

      - name: Syntax · core
        shell: bash
        run: |
          node --check app.js
          node --check sdk-spec.js
          node --check sdk-signatures.js

      - name: Syntax · editor
        if: always()
        shell: bash
        run: |
          node --check editor-advanced.js
          node --check editor-codemirror.js
          node --check studio-settings.js
          test -s vendor/codemirror/codemirror.js
          test -s vendor/codemirror/codemirror.css

      - name: Syntax · tools
        if: always()
        shell: bash
        run: |
          node --check plugin-tools.js
          node --check diagnostics.js
          node --check debug-tools.js
          node --check package-center.js
          node --check visual-builder.js
          node --check release-wizard.js

      - name: Syntax · crash-recovery.js
        if: always()
        shell: bash
        run: node --check crash-recovery.js

      - name: Syntax · help.js
        if: always()
        shell: bash
        run: node --check help.js

      - name: Syntax · project-manager.js
        if: always()
        shell: bash
        run: node --check project-manager.js

      - name: Syntax · simple-ui.js
        if: always()
        shell: bash
        run: node --check simple-ui.js

      - name: Syntax · onboarding.js
        if: always()
        shell: bash
        run: node --check onboarding.js

      - name: Syntax · one-click-build.js
        if: always()
        shell: bash
        run: node --check one-click-build.js

      - name: Syntax · Studio 2.1 modules
        if: always()
        shell: bash
        run: |
          node --check plugin-generator.js
          node --check testing-studio.js
          node --check release-pro.js
          node --check studio-polish.js
          node --check editor-pro.js
          node --check studio-shell.js
          node --check i18n.js
          node --check permission-assistant.js
          node --check studio-timeline.js
          node --check otzaria-simulator.js
          node --check workflow-builder.js
          node --check test-recorder.js

      - name: Plugin Studio regression checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          app = Path("app.js").read_text(encoding="utf-8")
          html = Path("index.html").read_text(encoding="utf-8")
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))

          errors = []
          if "window.otzaria" in app:
              errors.append("Generated code must use global Otzaria, not window.otzaria")
          if re.search(r"https?://", html + "\n" + Path("styles.css").read_text(encoding="utf-8")):
              errors.append("Runtime HTML/CSS contains an external URL")
          if manifest.get("homepage"):
              errors.append("Offline-only Plugin Studio must not declare homepage")
          if manifest.get("network", {}).get("enabled"):
              errors.append("Plugin Studio must remain offline")
          if any(str(p).startswith("network.") for p in manifest.get("permissions", [])):
              errors.append("Plugin Studio manifest contains a network permission")
          for required in ["editor","projects","newProject","importPackage","packageInput","preview","buildBtn","moreToolsBtn","modeBtn","helpBtn","designer","importInput","templates","quickOpen","problems","renameFile","deleteFile","projectSearch","eventsBtn","historyBtn","visualBuilderBtn","apiLabBtn","diagnosticsBtn","doctorBtn","packageCenterBtn","releaseWizardBtn","debugBtn","studioSettingsBtn"]:
              if f'id="{required}"' not in html:
                  errors.append(f"Missing required UI element: {required}")
          if "Otzaria.call('reader.addContextMenuItem'" in app and "label:" not in app:
              errors.append("Context menu template must use label")
          if "Otzaria.call('library.findBooks', {})" in app:
              errors.append("library.findBooks template must provide query")
          if 'Otzaria.on("theme.changed"' in app and "events.subscribe:theme.changed" not in manifest.get("permissions", []):
              errors.append("theme.changed is used without its event subscription permission")
          for required in ["storage.set","storage.get","Otzaria.on(","snapshotMaybe","eventCode","searchProject","missingPermissions","fixPermissions","preflight","pluginDoctor","apiPlayground","testRunner","offlineDocs","uiDesigner","releaseCenter","findReferences","refactorRename","snapshotDiff","goToLine","showApiHover","bracketStatus","updateBreadcrumbs"]:
              if required not in app:
                  errors.append(f"Missing Studio feature marker: {required}")

          if errors:
              raise SystemExit("\n".join("ERROR: "+e for e in errors))
          print("Plugin Studio regression checks passed")
          PY

      - name: Read plugin metadata
        id: meta
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          with open("manifest.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)
          plugin_id = manifest["id"]
          version = manifest["version"]
          entrypoint = manifest["entrypoint"]
          if not os.path.isfile(entrypoint):
              raise SystemExit(f"Entrypoint does not exist: {entrypoint}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"id={plugin_id}", file=out)
              print(f"version={version}", file=out)
              print(f"filename={plugin_id}-{version}.otzplugin", file=out)
          PY

      # Mirrors Otzaria's package rules for repository metadata:
      # development/CI folders, Markdown, LICENSE, dotfiles and lockfiles
      # are not shipped. manifest.json remains at the archive root.
      - name: Package .otzplugin
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, zipfile

          with open("manifest.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)

          output = f'{manifest["id"]}-{manifest["version"]}.otzplugin'
          skip_dirs = {
              ".git", ".svn", ".hg", ".idea", ".vscode", "node_modules",
              "__pycache__", ".claude", ".github", "screenshots"
          }

          def metadata_file(name):
              lower = name.lower()
              return (
                  name.startswith(".")
                  or lower.endswith(".md")
                  or lower.startswith("license")
                  or lower.startswith("licence")
                  or lower in {"package-lock.json", "yarn.lock", "pnpm-lock.yaml"}
              )

          files = []
          for root, dirs, names in os.walk("."):
              dirs[:] = [d for d in dirs if d not in skip_dirs and not d.startswith(".")]
              for name in names:
                  path = os.path.join(root, name)
                  rel = os.path.relpath(path, ".").replace(os.sep, "/")
                  if rel == output or name == ".otzignore" or metadata_file(name):
                      continue
                  files.append((path, rel))

          if "manifest.json" not in {rel for _, rel in files}:
              raise SystemExit("manifest.json must be at archive root")

          entrypoint = manifest["entrypoint"].replace("\\", "/").lstrip("./")
          if entrypoint not in {rel for _, rel in files}:
              raise SystemExit(f"Entrypoint would not be packaged: {entrypoint}")

          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as z:
              for path, rel in sorted(files, key=lambda x: x[1]):
                  z.write(path, rel)

          with zipfile.ZipFile(output) as z:
              names = set(z.namelist())
              if "manifest.json" not in names:
                  raise SystemExit("Packaged archive is missing manifest.json")
              if entrypoint not in names:
                  raise SystemExit("Packaged archive is missing entrypoint")

          print(f"Created {output} with {len(files)} files")
          PY

      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: Plugin-Studio-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.filename }}
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Otzaria plugin package"
            echo ""
            echo "- ID: \`${{ steps.meta.outputs.id }}\`"
            echo "- Version: \`${{ steps.meta.outputs.version }}\`"
            echo "- File: \`${{ steps.meta.outputs.filename }}\`"
            echo "- Official Otzaria validation: passed"
          } >> "$GITHUB_STEP_SUMMARY"
